# fly.toml app configuration file generated for cedric-job-tracker on 2026-08-03T19:56:59+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cedric-job-tracker'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  JT_DATA_DIR = '/data'
  # Sources publish 1-5 new postings a day; hourly catches them promptly without
  # hammering these free undocumented APIs. Fractional values work (0.25 = 15m).
  JT_SCRAPE_INTERVAL_HOURS = '1'
  PORT = '8080'

[[mounts]]
  source = 'jobtracker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
