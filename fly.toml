# fly.toml app configuration file generated for cedric-job-tracker on 2026-08-03T19:56:59+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cedric-job-tracker'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  JT_DATA_DIR = '/data'
  # 10 minutes, matching the dashboard's own refresh so the page and the database
  # move together. Fractional values are hours (0.1667 = 10m).
  JT_SCRAPE_INTERVAL_HOURS = '0.1667'
  PORT = '8080'

[[mounts]]
  source = 'jobtracker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
