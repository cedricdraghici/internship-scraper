# fly.toml app configuration file generated for cedric-job-tracker on 2026-08-03T19:56:59+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cedric-job-tracker'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  JT_DATA_DIR = '/data'
  # Fast sources (~10s per run) every 5 min — GitHub serves cache-control: max-age=300,
  # so polling harder than this just re-reads identical bytes. Workday costs ~106s for
  # ~11 jobs, so it runs on its own slower timer.
  JT_FAST_INTERVAL_MINUTES = '5'
  JT_SLOW_INTERVAL_MINUTES = '30'
  # Response cache must stay under the fast interval or runs re-read stale copies.
  JT_CACHE_MINUTES = '4'
  PORT = '8080'

[[mounts]]
  source = 'jobtracker_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
